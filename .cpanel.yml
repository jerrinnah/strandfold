---
deployment:
  tasks:
    # Where the live site lives. If cPanel reports an empty or wrong path,
    # replace $HOME with the literal home directory, e.g. /home/cpaneluser
    - export DEPLOYPATH=$HOME/public_html
    - /bin/mkdir -p $DEPLOYPATH

    # ---- Application code ----------------------------------------------
    # Copied wholesale so deleted files do not linger on the server.
    - /bin/rm -rf $DEPLOYPATH/assets $DEPLOYPATH/admin $DEPLOYPATH/templates $DEPLOYPATH/cli
    - /bin/cp -R assets $DEPLOYPATH/
    - /bin/cp -R admin $DEPLOYPATH/
    - /bin/cp -R templates $DEPLOYPATH/
    - /bin/cp -R cli $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/

    # Record every default the schema has ever had, from this checkout's git
    # history, so the upgrade step can tell untouched saved fields from real
    # edits. Written into the deployed copy, never into the checkout. If git
    # is unavailable the committed copy of the file is used instead.
    - (php cli/build-default-history.php $DEPLOYPATH/cli/default-history.json || /usr/local/bin/php cli/build-default-history.php $DEPLOYPATH/cli/default-history.json || true)
    - /bin/cp robots.txt $DEPLOYPATH/

    # ---- Live data — NEVER overwritten ---------------------------------
    # content/ holds everything staff have edited plus the admin accounts;
    # uploads/ holds their images. Both are created if missing and then left
    # entirely alone, so a deploy can never revert someone's edits.
    - /bin/mkdir -p $DEPLOYPATH/content $DEPLOYPATH/uploads
    - /bin/cp -n content/.htaccess $DEPLOYPATH/content/.htaccess || true
    - /bin/cp -n uploads/.htaccess $DEPLOYPATH/uploads/.htaccess || true
    - /bin/chmod 755 $DEPLOYPATH/content $DEPLOYPATH/uploads

    # Clear any extensionless page files. One of these would shadow the
    # clean-URL rewrite and serve stale content instead of the real page.
    - cd $DEPLOYPATH && /bin/rm -f index about get-help programmes stories get-involved faq policies contact

    # ---- Rebuild the static pages from the server's own content ---------
    # The .html files are generated, not deployed. If this step fails the
    # previous pages stay in place and keep serving.
    # Let improved defaults replace saved values nobody actually edited.
    # Anything staff wrote is left alone. Safe to repeat on every deploy.
    - cd $DEPLOYPATH && (php cli/upgrade-content.php || /usr/local/bin/php cli/upgrade-content.php || /usr/bin/php cli/upgrade-content.php || true)
    - cd $DEPLOYPATH && (php cli/render.php || /usr/local/bin/php cli/render.php || /usr/bin/php cli/render.php)
